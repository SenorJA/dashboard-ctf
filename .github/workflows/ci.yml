name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout bandit safety
      - name: Run tests with coverage
        working-directory: backend
        env:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          KALI_IP: ""
          KALI_MCP_URL: ""
        run: |
          # --timeout=60: prevents slow/hanging tests (network/timers) from
          # blocking the whole pipeline for hours. See TOMORROW.md bugs #1/#7.
          # -m "not slow": the 53 @pytest.mark.slow tests need real network
          # (SSH to Kali, DNS, port-scan, news RSS) and fail/hang on the runner;
          # the correct filter is by MARKER, not -k "not test_slow_hook"
          # (which only matches test names). Keep both filters.
          # set -o pipefail: tee must not mask pytest's exit code.
          set -o pipefail
          python -m pytest tests/ -m "not slow" -k "not test_slow_hook" --timeout=60 --timeout-method=thread --cov=. --cov-config=.coveragerc --cov-report=xml --cov-report=term-missing -q 2>&1 | tee pytest.log
      - name: Show failure summary (diagnostic)
        if: always()
        working-directory: backend
        run: |
          # Render the pytest verdict on the job page ($GITHUB_STEP_SUMMARY)
          # so the cause is visible without downloading the (large) raw log.
          {
            echo "## Pytest result summary"
            echo '```'
            grep -E "FAILED|ERROR|Coverage failure|fail-under|passed|failed" pytest.log | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ALSO emit the verdict as ::error:: workflow commands so it is
          # queryable via the check-runs annotations API (not just the UI).
          grep -E "FAILED|ERROR|Coverage failure|fail-under" pytest.log | tail -10 | sed 's/^/::error::/'
          tail -3 pytest.log | grep -E "passed|failed" | sed 's/^/::error::/'
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit safety
      - name: Bandit security scan
        working-directory: backend
        run: bandit -r . -ll -ii -x tests || true   # medium+ severity, don't fail build on low
      - name: Safety dependency scan
        continue-on-error: true
        run: safety check -r backend/requirements.txt || true