name: Desktop Build

# Compila el instalable de escritorio MIRV (sidecar PyInstaller + shell Tauri)
# en CI y, en tags v*, lo sube a GitHub Releases como artefacto.
#
# Trigger:
#   - push a main / PR a main  -> build de verificacion + sube artefacto
#   - tag v*                    -> ademas crea/adjunta GitHub Release
#   - workflow_dispatch         -> manual
#
# NOTA: requiere toolchain Rust + NuGet/WebView2 + Node, provistos aqui via
# acciones. El .msi se genera en windows-latest.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Backend sidecar (PyInstaller) ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend sidecar
        working-directory: backend
        run: python -m PyInstaller --noconfirm --clean mirv-backend.spec

      - name: Copy sidecar into Tauri binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/binaries/mirv-backend" | Out-Null
          Copy-Item -Recurse -Force "backend/dist/mirv-backend/*" "desktop/src-tauri/binaries/mirv-backend/"
          # Tauri resuelve el sidecar por nombre (opcional sufijo target triple).
          if (Test-Path "desktop/src-tauri/binaries/mirv-backend/mirv-backend.exe") {
            Rename-Item "desktop/src-tauri/binaries/mirv-backend/mirv-backend.exe" "mirv-backend-x86_64-pc-windows-msvc.exe"
          }
          Get-ChildItem -Recurse "desktop/src-tauri/binaries/mirv-backend" |
            Select-Object FullName, Length | Format-Table -AutoSize

      # ---- Tauri shell ----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        working-directory: desktop
        run: npm install

      - name: Sync canonical frontend into src
        working-directory: desktop
        run: node scripts/sync-frontend.mjs

      - name: Set up Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build MSI with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --bundles msi
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'MIRV Desktop ${{ startsWith(github.ref, ''refs/tags/'') && github.ref_name || '' }}'
          releaseDraft: true
          prerelease: false

      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirv-desktop-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
