name: Desktop Build

# Compila el instalable de escritorio MIRV (sidecar PyInstaller + shell Tauri)
# en CI y, en tags v*, lo sube a GitHub Releases como artefacto.
#
# Trigger:
#   - push a main / PR a main  -> build de verificacion + sube artefacto
#   - tag v*                    -> ademas crea/adjunta GitHub Release
#   - workflow_dispatch         -> manual
#
# NOTA: requiere toolchain Rust + NuGet/WebView2 + Node, provistos aqui via
# acciones. El .msi se genera en windows-latest.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    # Necesario para que tauri-action cree/actualice el GitHub Release (tags v*).
    # Sin esto, GITHUB_TOKEN es read-only y el job falla al publicar el release.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Backend sidecar (PyInstaller) ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend sidecar
        working-directory: backend
        run: python -m PyInstaller --noconfirm --clean mirv-backend.spec

      - name: Copy sidecar into Tauri binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/binaries" | Out-Null
          # OneFile build => single exe. Tauri resuelve el sidecar por
          # nombre + target triple directamente en src-tauri/binaries/.
          Copy-Item -Force "backend/dist/mirv-backend.exe" "desktop/src-tauri/binaries/mirv-backend-x86_64-pc-windows-msvc.exe"
          Get-ChildItem -Recurse "desktop/src-tauri/binaries" |
            Select-Object FullName, Length | Format-Table -AutoSize

      # ---- Tauri shell ----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        working-directory: desktop
        run: npm install

      - name: Sync canonical frontend into src
        working-directory: desktop
        run: node scripts/sync-frontend.mjs

      - name: Set up Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Updater artifacts config (releases only)
        id: updater_config
        # createUpdaterArtifacts NO esta en tauri.conf.json a proposito: si se
        # activa sin TAURI_SIGNING_PRIVATE_KEY el bundler falla ("public key
        # found but no private key"). Se activa SOLO en tags v* y SOLO si el
        # secret de firma existe -> los builds de main (verificacion) siguen
        # verdes sin firmar.
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:MIRV_TAURI_KEY) {
            Set-Content -Path "desktop/src-tauri/tauri.updater.json" -Value '{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}' -Encoding utf8
            Write-Output "updater_args=--config src-tauri/tauri.updater.json" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "updater_args=" >> $env:GITHUB_OUTPUT
          }
        env:
          MIRV_TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build MSI with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (Feature E). Empty secrets => tauri builds unsigned;
          # releases must set TAURI_SIGNING_PRIVATE_KEY + _PASSWORD (see .github/SECRETS.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --bundles msi ${{ steps.updater_config.outputs.updater_args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('MIRV {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirv-desktop-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      # ---- Updater manifest (releases only) ----
      # El updater de Tauri v2 carga latest.json del endpoint
      # releases/latest/download/latest.json. tauri-action no lo genera:
      # se construye aqui (version + sha256 + signature + url) y se sube a
      # la misma release (draft) ya creada con los artefactos firmados.
      - name: Generate + upload latest.json (releases only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msiZip = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi.zip" | Select-Object -First 1
          $msiSig = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi.zip.sig" | Select-Object -First 1
          $conf = Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $conf.version
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $msiZip.FullName).Hash.ToLower()
          $sig = (Get-Content $msiSig.FullName -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          $name = $msiZip.Name
          $json = @{
            version  = $version
            notes    = "MIRV $version release"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = "https://github.com/SenorJA/dashboard-ctf/releases/download/v$version/$name"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "desktop/latest.json" -Value $json -Encoding utf8
          Write-Output "latest.json -> $version / $name / sha256:$sha256"
          gh release upload "$env:GITHUB_REF_NAME" "desktop/latest.json" --clobber
